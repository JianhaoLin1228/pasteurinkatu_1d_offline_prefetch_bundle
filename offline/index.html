<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通勤地图 · Pasteurinkatu 1D</title>
<link rel="stylesheet" href="assets/leaflet.css">
<script src="assets/leaflet.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; color: #1f2937; }
#app { display: flex; height: 100vh; }

/* Sidebar */
#sidebar {
  width: 272px; min-width: 272px;
  background: #fff; border-right: 1px solid #e5e7eb;
  display: flex; flex-direction: column; overflow: hidden;
  z-index: 10; box-shadow: 2px 0 6px rgba(0,0,0,.07);
}
.s-head { padding: 14px 16px 12px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; flex-shrink: 0; }
.s-head h1 { font-size: 14px; font-weight: 700; }
.s-head p  { font-size: 11px; color: #6b7280; margin-top: 2px; }
.section   { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; flex-shrink: 0; }
.label     { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #9ca3af; margin-bottom: 7px; }

/* Buttons */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
.btn {
  padding: 6px 4px; border: 1.5px solid #d1d5db; border-radius: 7px;
  background: #fff; color: #374151; font-size: 11px; font-weight: 600;
  cursor: pointer; text-align: center; white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover:not(.inactive) { background: #f3f4f6; border-color: #9ca3af; }
.btn.on      { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
.btn.on-red  { background: #dc2626; border-color: #dc2626; color: #fff; }
.btn.on-blue { background: #2563eb; border-color: #2563eb; color: #fff; }
.btn.inactive { opacity: .35; cursor: default; }

/* Route list */
#routes-section { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.routes-head {
  padding: 8px 14px 6px; border-bottom: 1px solid #f3f4f6;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.routes-head .label { margin: 0; }
.text-link { font-size: 10px; color: #6b7280; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
#route-list { overflow-y: auto; flex: 1; padding: 4px 8px 8px; }
.r-row { display: flex; align-items: center; gap: 7px; padding: 3px 5px; border-radius: 5px; }
.r-row:hover { background: #f9fafb; }
.r-row label { display: flex; align-items: center; gap: 7px; cursor: pointer; width: 100%; }
.r-bar { width: 20px; height: 4px; border-radius: 3px; flex-shrink: 0; }
.r-sn  { font-weight: 700; min-width: 28px; font-size: 12px; }
.r-nm  { color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }

/* Map */
#map { flex: 1; }

/* Loading */
#loading {
  position: fixed; inset: 0; background: rgba(255,255,255,.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; font-size: 13px; color: #6b7280; transition: opacity .2s;
}
#loading.hidden { opacity: 0; pointer-events: none; }

/* Commute legend */
#commute-legend {
  position: absolute; bottom: 48px; right: 10px; z-index: 900;
  background: rgba(255,255,255,.93); border: 1px solid #e5e7eb; border-radius: 8px;
  padding: 8px 10px; font-size: 11px; line-height: 1.75; display: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
#commute-legend.visible { display: block; }
.leg-row { display: flex; align-items: center; gap: 6px; }
.leg-line { width: 18px; height: 3px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">

<div id="sidebar">
  <div class="s-head">
    <h1>校园通勤地图</h1>
    <p>Pasteurinkatu 1D · Helsinki</p>
  </div>

  <div class="section">
    <div class="label">目标校区</div>
    <div class="grid2">
      <button class="btn on" id="btn-viikki" onclick="setCampus('viikki')">UH Viikki</button>
      <button class="btn"    id="btn-aalto"  onclick="setCampus('aalto')">Aalto Otaniemi</button>
    </div>
  </div>

  <div class="section">
    <div class="label">通勤时间圈</div>
    <div class="grid3" id="thr-btns">
      <button class="btn" data-min="10" onclick="setThreshold(10)">≤10 min</button>
      <button class="btn" data-min="15" onclick="setThreshold(15)">≤15 min</button>
      <button class="btn" data-min="20" onclick="setThreshold(20)">≤20 min</button>
      <button class="btn" data-min="30" onclick="setThreshold(30)">≤30 min</button>
      <button class="btn" data-min="40" onclick="setThreshold(40)">≤40 min</button>
      <button class="btn" data-min="0"  onclick="setThreshold(0)">关闭</button>
    </div>
  </div>

  <div class="section">
    <div class="label">学生房源</div>
    <div class="grid2">
      <button class="btn" id="btn-hoas" onclick="toggleLayer('hoas')">HOAS</button>
      <button class="btn" id="btn-hys"  onclick="toggleLayer('hys')">HYS</button>
      <button class="btn" id="btn-ayy"  onclick="toggleLayer('ayy')" style="display:none">AYY</button>
    </div>
  </div>

  <div class="section">
    <div class="label">其他图层</div>
    <div class="grid2">
      <button class="btn" id="btn-zones" onclick="toggleLayer('zones')">HSL 票价区</button>
      <button class="btn" id="btn-walk"  onclick="toggleLayer('walk')">步行圈</button>
    </div>
  </div>

  <div id="routes-section">
    <div class="routes-head">
      <div class="label">公交线路</div>
      <div>
        <button class="text-link" onclick="allRoutes(true)">全选</button>&nbsp;
        <button class="text-link" onclick="allRoutes(false)">全隐</button>
      </div>
    </div>
    <div id="route-list"></div>
  </div>
</div>

<div id="map"></div>
</div>

<div id="commute-legend">
  <div class="leg-row"><div class="leg-line" style="background:#22c55e"></div>10 分钟</div>
  <div class="leg-row"><div class="leg-line" style="background:#0f766e"></div>15 分钟</div>
  <div class="leg-row"><div class="leg-line" style="background:#2563eb"></div>20 分钟</div>
  <div class="leg-row"><div class="leg-line" style="background:#f97316"></div>30 分钟</div>
  <div class="leg-row"><div class="leg-line" style="background:#7c3aed"></div>40 分钟</div>
</div>

<div id="loading">加载中…</div>

<script>
'use strict';

const HOME = [60.2245961, 25.014318];
const WALK_SPEED = 80;

const CAMPUS_CFG = {
  viikki: {
    view: { ll: [60.229, 25.016], zoom: 13 },
    commuteFiles: ['data/commute_isochrones.geojson', 'data/commute_10_15_40_gtfs.geojson'],
    hoasFile: 'data/hoas_listings.geojson',
    hysFile:  'data/hys_listings.geojson',
    availMin: [10, 15, 20, 30, 40]
  },
  aalto: {
    view: { bounds: [[60.170, 24.795], [60.205, 24.870]] },
    commuteFiles: ['data/commute_aalto_otaniemi_gtfs.geojson'],
    hoasFile: 'data/hoas_listings_aalto_otaniemi.geojson',
    hysFile:  'data/hys_listings_aalto_otaniemi.geojson',
    availMin: [10, 15, 20, 30, 40]
  }
};

const COMMUTE_COLORS = { 10:'#22c55e', 15:'#0f766e', 20:'#2563eb', 30:'#f97316', 40:'#7c3aed' };
const ZONE_COLORS   = { A:'#22c55e', B:'#2563eb', C:'#f97316', D:'#7c3aed' };

let campus    = 'viikki';
let threshold = 0;
const layerOn = { hoas:false, hys:false, ayy:false, zones:false, walk:false };
const cache   = { commute:{}, hoas:{}, hys:{}, ayy:null, zones:null };
const routeGroups = {};

/* ── Map ── */
const map = L.map('map', { zoomControl:false, preferCanvas:true }).setView(HOME, 13);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.control.scale({ imperial:false, position:'bottomright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
  subdomains:'abcd', maxZoom:19
}).addTo(map);

L.circleMarker(HOME, { radius:8, color:'#fff', fillColor:'#ef4444', fillOpacity:1, weight:2.5 })
  .bindPopup('<b>Pasteurinkatu 1D</b>').addTo(map);

const CAMPUS_CENTER = {
  viikki: [60.2268, 25.0196],
  aalto:  [60.1842, 24.8269],
};
const walkGroup = L.layerGroup();
function rebuildWalkCircles(c) {
  walkGroup.clearLayers();
  const center = CAMPUS_CENTER[c];
  L.circle(center, { radius:10*WALK_SPEED, color:'#16a34a', weight:1.5, dashArray:'5 4', fill:false, opacity:.55 })
    .bindPopup('10 分钟步行圈（~800 m）').addTo(walkGroup);
  L.circle(center, { radius:15*WALK_SPEED, color:'#0f766e', weight:1.5, dashArray:'8 5', fill:false, opacity:.45 })
    .bindPopup('15 分钟步行圈（~1200 m）').addTo(walkGroup);
}

/* ── House icon factory ── */
function houseIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="30" viewBox="0 0 28 30">
    <polygon points="14,1 1,13 5,13 5,29 23,29 23,13 27,13"
      fill="${color}" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    <rect x="10" y="18" width="8" height="11" fill="rgba(255,255,255,0.3)" rx="1"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize:[28,30], iconAnchor:[14,30], popupAnchor:[0,-30] });
}
const ICON_HOAS = houseIcon('#dc2626');
const ICON_HYS  = houseIcon('#2563eb');
const ICON_AYY  = houseIcon('#7c3aed');

const commuteGroup = L.layerGroup().addTo(map);
const hoasGroup    = L.layerGroup().addTo(map);
const hysGroup     = L.layerGroup().addTo(map);
const ayyGroup     = L.layerGroup().addTo(map);
const zonesGroup   = L.layerGroup().addTo(map);

/* ── Loading ── */
let loadN = 0;
function setLoading(on) {
  loadN = Math.max(0, loadN + (on ? 1 : -1));
  document.getElementById('loading').classList.toggle('hidden', loadN === 0);
}
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}

/* ── Routes ── */
async function initRoutes() {
  setLoading(true);
  try {
    const gj = await fetchJson('data/routes.geojson');
    const byLine = {};
    gj.features.forEach(f => {
      const { route_short_name:sn, route_long_name:nm, color } = f.properties;
      if (!byLine[sn]) byLine[sn] = { color: color||'#666', name: nm||'', features:[] };
      byLine[sn].features.push(f);
    });

    const listEl = document.getElementById('route-list');
    Object.entries(byLine)
      .sort(([a],[b]) => { const na=parseInt(a)||9999, nb=parseInt(b)||9999; return na!==nb ? na-nb : a.localeCompare(b); })
      .forEach(([sn, info]) => {
        const grp = L.layerGroup();
        info.features.forEach(f => {
          L.polyline(f.geometry.coordinates.map(c=>[c[1],c[0]]), { color:info.color, weight:2.5, opacity:.82 })
            .bindPopup('<b>'+sn+'</b><br>'+info.name).addTo(grp);
        });
        grp.addTo(map);
        routeGroups[sn] = grp;

        const row = document.createElement('div'); row.className = 'r-row';
        const lbl = document.createElement('label');
        const cb  = document.createElement('input'); cb.type='checkbox'; cb.checked=true;
        cb.onchange = () => cb.checked ? grp.addTo(map) : map.removeLayer(grp);
        const bar = document.createElement('span'); bar.className='r-bar'; bar.style.background=info.color;
        const snEl = document.createElement('span'); snEl.className='r-sn'; snEl.textContent=sn;
        const nmEl = document.createElement('span'); nmEl.className='r-nm';
        nmEl.textContent = info.name.replace(/^[^-]+-\s*/,'').trim() || info.name;
        lbl.append(cb, bar, snEl, nmEl); row.appendChild(lbl); listEl.appendChild(row);
      });
  } finally { setLoading(false); }
}

function allRoutes(on) {
  Object.values(routeGroups).forEach(g => on ? g.addTo(map) : map.removeLayer(g));
  document.querySelectorAll('#route-list input').forEach(cb => cb.checked = on);
}

function bringRoutesToTop() {
  Object.values(routeGroups).forEach(g => g.eachLayer(l => l.bringToFront && l.bringToFront()));
}
map.on('layeradd', () => setTimeout(bringRoutesToTop, 60));

/* ── Commute ── */
async function ensureCommute(c) {
  if (cache.commute[c]) return;
  setLoading(true);
  try {
    const files = CAMPUS_CFG[c].commuteFiles;
    const datasets = await Promise.all(files.map(f => fetchJson(f)));
    const merged = { type: 'FeatureCollection', features: [] };
    datasets.forEach(d => merged.features.push(...d.features));
    cache.commute[c] = merged;
  } finally { setLoading(false); }
}

function renderCommute(data, maxMin) {
  commuteGroup.clearLayers();
  if (!maxMin || !data) return;
  const fills = [], outlines = [];
  data.features.forEach(f => {
    const p = f.properties || {};
    const m = Number(p.minutes);
    if (m > maxMin || f.geometry.type !== 'Polygon') return;
    const lls = f.geometry.coordinates[0].map(c => [c[1],c[0]]);
    const color = COMMUTE_COLORS[m] || '#666';
    if (p.kind === 'residual_walk_circle') {
      fills.push(L.polygon(lls, { color, weight:0, fillColor:color, fillOpacity:.09 }));
    } else if (p.kind === 'convex_hull_outline') {
      outlines.push(L.polygon(lls, { color, weight: m===40?3:2.5, fill:false, dashArray: m===40?'10 5':'6 4', opacity:.9 })
        .bindPopup(m+' 分钟通勤圈（早高峰 GTFS+等候时间）'));
    }
  });
  fills.forEach(l => l.addTo(commuteGroup));
  outlines.forEach(l => l.addTo(commuteGroup));
  document.getElementById('commute-legend').classList.add('visible');
}

async function setThreshold(t) {
  threshold = t;
  document.querySelectorAll('#thr-btns .btn').forEach(b => b.classList.toggle('on', Number(b.dataset.min)===t));
  commuteGroup.clearLayers();
  if (!t) { document.getElementById('commute-legend').classList.remove('visible'); return; }
  await ensureCommute(campus);
  renderCommute(cache.commute[campus], t);
  bringRoutesToTop();
}

function updateThrButtons() {
  const avail = CAMPUS_CFG[campus].availMin;
  document.querySelectorAll('#thr-btns .btn').forEach(b => {
    const m = Number(b.dataset.min);
    b.classList.toggle('inactive', m !== 0 && !avail.includes(m));
  });
}

/* ── Campus ── */
async function setCampus(c) {
  campus = c;
  document.getElementById('btn-viikki').classList.toggle('on', c==='viikki');
  document.getElementById('btn-aalto').classList.toggle('on',  c==='aalto');
  threshold = 0;
  commuteGroup.clearLayers();
  document.querySelectorAll('#thr-btns .btn').forEach(b => b.classList.remove('on'));
  document.getElementById('commute-legend').classList.remove('visible');
  updateThrButtons();

  // Housing availability: HYS = UH only, AYY = Aalto only, HOAS = both
  const btnHys = document.getElementById('btn-hys');
  const btnAyy = document.getElementById('btn-ayy');
  if (c === 'aalto') {
    btnHys.style.display = 'none';
    btnAyy.style.display = '';
    if (layerOn.hys) {
      layerOn.hys = false; hysGroup.clearLayers();
      btnHys.classList.remove('on-blue');
    }
  } else {
    btnAyy.style.display = 'none';
    btnHys.style.display = '';
    if (layerOn.ayy) {
      layerOn.ayy = false; ayyGroup.clearLayers();
      btnAyy.classList.remove('on');
    }
  }

  const v = CAMPUS_CFG[c].view;
  if (v.bounds) map.fitBounds(v.bounds, { padding:[24,24] });
  else map.setView(v.ll, v.zoom);
  if (layerOn.hoas) { hoasGroup.clearLayers(); delete cache.hoas[c]; await loadHousing('hoas'); }
  if (layerOn.hys && c==='viikki') { hysGroup.clearLayers(); delete cache.hys[c]; await loadHousing('hys'); }
  if (layerOn.walk) rebuildWalkCircles(c);
}

/* ── Housing ── */
function hoasPopup(p) {
  const rent = [p.min_rent!=null?'€'+p.min_rent:null, p.max_rent!=null&&p.max_rent!==p.min_rent?'€'+p.max_rent:null].filter(Boolean).join('–');
  const commute = p.aalto_otaniemi_min!=null ? '<br>🚇 至 Aalto: ~'+p.aalto_otaniemi_min+' min' : '';
  const cond = p.condition ? '<br>'+p.condition : '';
  return '<b>'+(p.address||'HOAS')+'</b>'+(rent?'<br>'+rent+'/月':'')+commute+cond+'<br><a href="'+p.url+'" target="_blank">查看 →</a>';
}
function hysPopup(p) {
  const commute = p.aalto_otaniemi_min!=null ? '<br>🚇 至 Aalto: ~'+p.aalto_otaniemi_min+' min' : '';
  return '<b>'+(p.address||p.name||'HYS')+'</b>'+commute+'<br><a href="'+p.url+'" target="_blank">查看 →</a>';
}

async function loadHousing(type) {
  const isHoas = type === 'hoas';
  const grp = isHoas ? hoasGroup : hysGroup;
  if (!cache[type][campus]) {
    setLoading(true);
    try { cache[type][campus] = await fetchJson(isHoas ? CAMPUS_CFG[campus].hoasFile : CAMPUS_CFG[campus].hysFile); }
    finally { setLoading(false); }
  }
  grp.clearLayers();
  cache[type][campus].features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    L.marker([lat,lon], { icon: isHoas ? ICON_HOAS : ICON_HYS })
      .bindPopup(isHoas ? hoasPopup(f.properties) : hysPopup(f.properties))
      .addTo(grp);
  });
}

/* ── AYY ── */
function ayyPopup(p) {
  const rent = p.rent ? `<br>${p.rent}/月` : '';
  const types = p.room_types ? `<br>${p.room_types}` : '';
  const yr = p.year_built ? ` (${p.year_built})` : '';
  const units = p.n_units ? `<br>${p.n_units} 套` : '';
  return `<b>${p.address}</b>${yr}<br>${p.city}${rent}${types}${units}<br><a href="${p.url}" target="_blank">楼栋详情 →</a>`;
}

async function loadAyy() {
  if (!cache.ayy) {
    setLoading(true);
    try { cache.ayy = await fetchJson('data/ayy_listings.geojson'); }
    finally { setLoading(false); }
  }
  ayyGroup.clearLayers();
  cache.ayy.features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    L.marker([lat, lon], { icon: ICON_AYY })
      .bindPopup(ayyPopup(f.properties)).addTo(ayyGroup);
  });
}

/* ── Toggle ── */
async function toggleLayer(type) {
  layerOn[type] = !layerOn[type];
  const on = layerOn[type];
  const cfg = { hoas:['btn-hoas','on-red'], hys:['btn-hys','on-blue'], ayy:['btn-ayy','on'], zones:['btn-zones','on'], walk:['btn-walk','on'] };
  const [id, cls] = cfg[type];
  document.getElementById(id).classList.toggle(cls, on);

  if (type === 'hoas') {
    if (on) await loadHousing('hoas'); else hoasGroup.clearLayers();
  } else if (type === 'hys') {
    if (on) await loadHousing('hys'); else hysGroup.clearLayers();
  } else if (type === 'ayy') {
    if (on) await loadAyy(); else ayyGroup.clearLayers();
  } else if (type === 'zones') {
    if (on) {
      if (!cache.zones) {
        setLoading(true);
        try { cache.zones = await fetchJson('data/hsl_zones.geojson'); } finally { setLoading(false); }
      }
      L.geoJSON(cache.zones, {
        style: f => ({ color: ZONE_COLORS[(f.properties.zone||'').toUpperCase()]||'#888', weight:2, fillOpacity:.04, dashArray:'5 4' }),
        onEachFeature: (f,l) => { if(f.properties.zone) l.bindPopup('HSL 票价区 '+f.properties.zone); }
      }).addTo(zonesGroup);
    } else { zonesGroup.clearLayers(); }
  } else if (type === 'walk') {
    if (on) { rebuildWalkCircles(campus); walkGroup.addTo(map); } else map.removeLayer(walkGroup);
  }
}

/* ── Init ── */
updateThrButtons();
rebuildWalkCircles(campus);
initRoutes();
</script>
</body>
</html>

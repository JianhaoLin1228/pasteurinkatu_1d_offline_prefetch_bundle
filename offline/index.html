<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通勤地图 · Pasteurinkatu 1D</title>
<link rel="stylesheet" href="assets/leaflet.css">
<script src="assets/leaflet.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; color: #1f2937; }
#app { display: flex; height: 100vh; }

/* Sidebar */
#sidebar {
  width: 272px; min-width: 272px;
  background: #fff; border-right: 1px solid #e5e7eb;
  display: flex; flex-direction: column; overflow: hidden;
  z-index: 10; box-shadow: 2px 0 6px rgba(0,0,0,.07);
}
.s-head { padding: 14px 16px 12px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; flex-shrink: 0; }
.s-head h1 { font-size: 14px; font-weight: 700; }
.s-head p  { font-size: 11px; color: #6b7280; margin-top: 2px; }
.section   { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; flex-shrink: 0; }
.label     { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #9ca3af; margin-bottom: 7px; }

/* Buttons */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
.btn {
  padding: 6px 4px; border: 1.5px solid #d1d5db; border-radius: 7px;
  background: #fff; color: #374151; font-size: 11px; font-weight: 600;
  cursor: pointer; text-align: center; white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover:not(.inactive) { background: #f3f4f6; border-color: #9ca3af; }
.btn.on      { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
.btn.on-red  { background: #dc2626; border-color: #dc2626; color: #fff; }
.btn.on-blue { background: #2563eb; border-color: #2563eb; color: #fff; }
.btn.inactive { opacity: .35; cursor: default; }

/* Commute slider */
#thr-row { display:flex; align-items:center; gap:8px; }
#thr-slider { flex:1; accent-color:#1d4ed8; cursor:pointer; }
#thr-label { font-size:11px; font-weight:700; color:#1d4ed8; min-width:38px; text-align:right; }

/* Global search */
#gs-wrap {
  position: fixed; top: 10px; right: 10px; z-index: 1000; width: 260px;
}
#gs-input {
  width: 100%; padding: 7px 12px; border: 1.5px solid #d1d5db; border-radius: 8px;
  font-size: 13px; font-family: inherit; color: #1f2937; outline: none;
  background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.13);
  transition: border-color .15s;
}
#gs-input:focus { border-color: #6366f1; box-shadow: 0 2px 14px rgba(99,102,241,.18); }
#gs-results {
  display: none; margin-top: 4px; background: #fff; border: 1px solid #e5e7eb;
  border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.13);
  max-height: 380px; overflow-y: auto;
}
#gs-results.visible { display: block; }
.gs-group-head {
  font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: #9ca3af; padding: 8px 12px 3px; border-top: 1px solid #f3f4f6;
}
.gs-group-head:first-child { border-top: none; }
.gs-item {
  padding: 6px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 1px;
}
.gs-item:hover { background: #f3f4f6; }
.gs-addr { font-size: 12px; font-weight: 600; color: #1f2937; }
.gs-meta { font-size: 11px; color: #6b7280; }
.gs-more { font-size: 11px; color: #9ca3af; padding: 3px 12px 6px; }
.gs-empty { font-size: 12px; color: #9ca3af; text-align: center; padding: 14px; }

/* Supermarket toggle buttons */
#super-btns { display: flex; gap: 5px; margin-top: 5px; }
.s-btn {
  flex: 1; padding: 5px 4px; border-radius: 7px; border: 1.5px solid #d1d5db;
  background: #fff; font-size: 11px; font-weight: 700; cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.1); transition: background .12s, border-color .12s, color .12s;
}
.s-btn:hover { background: #f3f4f6; }
#sbtn-k.on    { background: #e8711a; border-color: #e8711a; color: #fff; }
#sbtn-s.on    { background: #2d8a3e; border-color: #2d8a3e; color: #fff; }
#sbtn-lidl.on  { background: #0050aa; border-color: #0050aa; color: #fff; }
#sbtn-jiahe.on { background: #c0392b; border-color: #c0392b; color: #fff; }

/* Route list */
#routes-section { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.routes-head {
  padding: 8px 14px 6px; border-bottom: 1px solid #f3f4f6;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.routes-head .label { margin: 0; }
.text-link { font-size: 10px; color: #6b7280; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
#route-list { overflow-y: auto; flex: 1; padding: 4px 8px 8px; }
.r-row { display: flex; align-items: center; gap: 7px; padding: 3px 5px; border-radius: 5px; }
.r-row:hover { background: #f9fafb; }
.r-row label { display: flex; align-items: center; gap: 7px; cursor: pointer; width: 100%; }
.r-bar { width: 20px; height: 4px; border-radius: 3px; flex-shrink: 0; }
.r-sn  { font-weight: 700; min-width: 28px; font-size: 12px; }
.r-nm  { color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }

/* Map */
#map { flex: 1; }

/* Loading */
#loading {
  position: fixed; inset: 0; background: rgba(255,255,255,.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; font-size: 13px; color: #6b7280; transition: opacity .2s;
}
#loading.hidden { opacity: 0; pointer-events: none; }

/* Commute legend */
#commute-legend {
  position: absolute; bottom: 48px; right: 10px; z-index: 900;
  background: rgba(255,255,255,.93); border: 1px solid #e5e7eb; border-radius: 8px;
  padding: 8px 10px; font-size: 11px; line-height: 1.75; display: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
#commute-legend.visible { display: block; }
.leg-row { display: flex; align-items: center; gap: 6px; }
.leg-line { width: 18px; height: 3px; border-radius: 2px; flex-shrink: 0; }

/* Language bar */
#lang-bar {
  padding: 8px 14px; border-top: 1px solid #e5e7eb;
  display: flex; gap: 5px; flex-shrink: 0; background: #f9fafb;
}
.lang-btn {
  flex: 1; padding: 5px 4px; border: 1.5px solid #d1d5db; border-radius: 6px;
  background: #fff; font-size: 11px; font-weight: 600; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.lang-btn:hover { background: #f3f4f6; }
.lang-btn.on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
</style>
</head>
<body>
<div id="app">

<div id="sidebar">
  <div class="s-head">
    <h1 id="ui-title">校园通勤地图</h1>
    <p>Pasteurinkatu 1D · Helsinki</p>
  </div>

  <div class="section">
    <div class="label" id="lbl-campus">目标校区</div>
    <div class="grid2">
      <button class="btn on" id="btn-viikki" onclick="setCampus('viikki')">UH Viikki</button>
      <button class="btn"    id="btn-aalto"  onclick="setCampus('aalto')">Aalto Otaniemi</button>
    </div>
  </div>

  <div class="section">
    <div class="label" id="lbl-commute">通勤时间圈</div>
    <div id="thr-row">
      <input type="range" id="thr-slider" min="0" max="5" step="1" value="0"
             oninput="onSlider(this.value)">
      <span id="thr-label">关闭</span>
    </div>
  </div>

  <div class="section">
    <div class="label" id="lbl-housing">学生房源</div>
    <div class="grid2">
      <button class="btn" id="btn-hoas" onclick="toggleLayer('hoas')">HOAS</button>
      <button class="btn" id="btn-hys"  onclick="toggleLayer('hys')">HYS</button>
      <button class="btn" id="btn-ayy"  onclick="toggleLayer('ayy')" style="display:none">AYY</button>
    </div>
  </div>

  <div class="section">
    <div class="label" id="lbl-other">其他图层</div>
    <div class="grid2">
      <button class="btn" id="btn-zones" onclick="toggleLayer('zones')">HSL 票价区</button>
      <button class="btn" id="btn-walk"  onclick="toggleLayer('walk')">步行圈</button>
    </div>
  </div>

  <div id="routes-section">
    <div class="routes-head" onclick="toggleRoutePanel()" style="cursor:pointer;">
      <div style="display:flex;align-items:center;gap:5px;">
        <span id="routes-arrow" style="font-size:10px;color:#9ca3af;">▼</span>
        <div class="label" id="lbl-routes" style="margin:0;">公交线路</div>
      </div>
      <div onclick="event.stopPropagation()">
        <button class="text-link" id="btn-all-routes" onclick="allRoutes(true)">全选</button>&nbsp;
        <button class="text-link" id="btn-none-routes" onclick="allRoutes(false)">全隐</button>
      </div>
    </div>
    <div id="route-list"></div>
  </div>

  <div id="lang-bar">
    <button class="lang-btn on" id="lang-zh" onclick="setLang('zh')">中文</button>
    <button class="lang-btn"    id="lang-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn"    id="lang-fi" onclick="setLang('fi')">FI</button>
  </div>
</div>

<div id="map"></div>
</div>

<div id="commute-legend">
  <div class="leg-row"><div class="leg-line" style="background:#22c55e"></div><span class="leg-min" data-min="10">10 分钟</span></div>
  <div class="leg-row"><div class="leg-line" style="background:#0f766e"></div><span class="leg-min" data-min="15">15 分钟</span></div>
  <div class="leg-row"><div class="leg-line" style="background:#2563eb"></div><span class="leg-min" data-min="20">20 分钟</span></div>
  <div class="leg-row"><div class="leg-line" style="background:#f97316"></div><span class="leg-min" data-min="30">30 分钟</span></div>
  <div class="leg-row"><div class="leg-line" style="background:#7c3aed"></div><span class="leg-min" data-min="40">40 分钟</span></div>
</div>

<div id="gs-wrap">
  <input id="gs-input" type="text" placeholder="🔍 搜索公寓地址…" oninput="onSearchInput(this.value)" onfocus="if(this.value.trim())document.getElementById('gs-results').classList.add('visible')">
  <div id="gs-results"></div>
  <div id="super-btns">
    <button class="s-btn" id="sbtn-k"     onclick="toggleSuper('k')"     title="K超市">K超</button>
    <button class="s-btn" id="sbtn-s"     onclick="toggleSuper('s')"     title="S超市">S超</button>
    <button class="s-btn" id="sbtn-lidl"  onclick="toggleSuper('lidl')"  title="Lidl">Lidl</button>
    <button class="s-btn" id="sbtn-jiahe" onclick="toggleSuper('jiahe')" title="Asian supermarkets">Asia</button>
  </div>
</div>

<div id="loading">加载中…</div>

<script>
'use strict';

const HOME = [60.2245961, 25.014318];
const WALK_SPEED = 80;

const CAMPUS_CFG = {
  viikki: {
    view: { ll: [60.229, 25.016], zoom: 13 },
    commuteFiles: ['data/commute_isochrones.geojson', 'data/commute_10_15_40_gtfs.geojson'],
    hoasFile: 'data/hoas_listings.geojson',
    hysFile:  'data/hys_listings.geojson',
    availMin: [10, 15, 20, 30, 40]
  },
  aalto: {
    view: { bounds: [[60.170, 24.795], [60.205, 24.870]] },
    commuteFiles: ['data/commute_aalto_otaniemi_gtfs.geojson'],
    hoasFile: 'data/hoas_listings_aalto_otaniemi.geojson',
    hysFile:  'data/hys_listings_aalto_otaniemi.geojson',
    availMin: [10, 15, 20, 30, 40]
  }
};

const COMMUTE_COLORS = { 10:'#22c55e', 15:'#0f766e', 20:'#2563eb', 30:'#f97316', 40:'#7c3aed' };
const ZONE_COLORS   = { A:'#22c55e', B:'#2563eb', C:'#f97316', D:'#7c3aed' };

let campus    = 'viikki';
let threshold = 0;
const layerOn = { hoas:false, hys:false, ayy:false, zones:false, walk:false };
const cache   = { commute:{}, hoas:{}, hys:{}, ayy:null, zones:null };
const routeGroups = {};
const routeCBs    = {};   // sn → checkbox element
const VIIKKI_ROUTES = new Set(['15','506','57','70','701','73','73N','74','74N','77','78','78N','79','79N']);
const AALTO_ROUTES  = new Set(['15', 'M2']);

/* ── Map ── */
const map = L.map('map', { zoomControl:false, preferCanvas:true }).setView(HOME, 13);
L.control.scale({ imperial:false, position:'bottomright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
  subdomains:'abcd', maxZoom:19
}).addTo(map);


const CAMPUS_CENTER = {
  viikki: [60.2268, 25.0196],
  aalto:  [60.1842, 24.8269],
};

/* ── Campus centre marker (H / A) ── */
function makeCampusIcon(letter, color) {
  return L.divIcon({
    html: `<div style="
      width:32px;height:32px;border-radius:50%;
      background:${color};border:2.5px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,.35);
      display:flex;align-items:center;justify-content:center;
      font:700 15px/1 system-ui,sans-serif;color:#fff;
    ">${letter}</div>`,
    className: '',
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -18],
  });
}
const CAMPUS_ICON = {
  viikki: makeCampusIcon('H', '#0055a4'),
  aalto:  makeCampusIcon('A', '#e94520'),
};
const CAMPUS_LABEL = {
  viikki: 'Viikki Campus · University of Helsinki',
  aalto:  'Otaniemi Campus · Aalto University',
};
let campusMarker = L.marker(CAMPUS_CENTER.viikki, { icon: CAMPUS_ICON.viikki })
  .bindPopup(CAMPUS_LABEL.viikki)
  .addTo(map);

function updateCampusMarker(c) {
  campusMarker.setLatLng(CAMPUS_CENTER[c])
              .setIcon(CAMPUS_ICON[c])
              .setPopupContent(CAMPUS_LABEL[c]);
}

const walkGroup = L.layerGroup();
function rebuildWalkCircles(c) {
  walkGroup.clearLayers();
  const center = CAMPUS_CENTER[c];
  L.circle(center, { radius:10*WALK_SPEED, color:'#16a34a', weight:1.5, dashArray:'5 4', fill:false, opacity:.55 })
    .bindPopup(T('walk_10')).addTo(walkGroup);
  L.circle(center, { radius:15*WALK_SPEED, color:'#0f766e', weight:1.5, dashArray:'8 5', fill:false, opacity:.45 })
    .bindPopup(T('walk_15')).addTo(walkGroup);
}

function houseEmoji(border) {
  return L.divIcon({
    className: '',
    html: `<div style="width:26px;height:26px;line-height:22px;text-align:center;font-size:16px;background:#fff;border:2px solid ${border};border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.35);">🏠</div>`,
    iconSize: [26,26], iconAnchor: [13,26], popupAnchor: [0,-28],
  });
}
const ICON_HOAS = houseEmoji('#dc2626');
const ICON_HYS  = houseEmoji('#2563eb');
const ICON_AYY  = houseEmoji('#7c3aed');
const TYPE_COLOR = { HOAS:'#dc2626', HYS:'#2563eb', AYY:'#7c3aed' };

/* ── Supermarket icons ── */
const SUPER_CFG = {
  k:     { bg:'#f37021', logo:'assets/logo_k.svg',    file:'data/supermarkets_k.geojson' },
  s:     { bg:'#00aa46', logo:'assets/logo_s.svg',    file:'data/supermarkets_s.geojson' },
  lidl:  { bg:'#0050aa', logo:'assets/logo_lidl.png', file:'data/supermarkets_lidl.geojson' },
  jiahe: { bg:'#c0392b', text:'Asia',                  file:'data/supermarkets_jiahe.geojson' },
};
function superIcon(bg, logo) {
  return L.divIcon({
    className: '',
    html: `<div style="width:22px;height:22px;border-radius:50%;background:${bg};border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.28);overflow:hidden;display:flex;align-items:center;justify-content:center;"><img src="${logo}" style="width:19px;height:19px;object-fit:contain;"></div>`,
    iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-13],
  });
}
function superTextIcon(bg, text) {
  return L.divIcon({
    className: '',
    html: `<div style="width:22px;height:22px;border-radius:50%;background:${bg};border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;line-height:1;">${text}</div>`,
    iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-13],
  });
}
const superGroups = { k: L.layerGroup(), s: L.layerGroup(), lidl: L.layerGroup(), jiahe: L.layerGroup() };
const superOn     = { k: false, s: false, lidl: false, jiahe: false };
const superCache  = { k: null, s: null, lidl: null, jiahe: null };

const commuteGroup  = L.layerGroup().addTo(map);
const hoasGroup     = L.layerGroup().addTo(map);
const hysGroup      = L.layerGroup().addTo(map);
const ayyGroup      = L.layerGroup().addTo(map);
const zonesGroup    = L.layerGroup().addTo(map);
const gsMarkGroup   = L.layerGroup().addTo(map);

/* ── Loading ── */
let loadN = 0;
function setLoading(on) {
  loadN = Math.max(0, loadN + (on ? 1 : -1));
  document.getElementById('loading').classList.toggle('hidden', loadN === 0);
}
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}

/* ── Routes ── */
async function initRoutes() {
  setLoading(true);
  try {
    const gj = await fetchJson('data/routes.geojson');
    const byLine = {};
    gj.features.forEach(f => {
      const { route_short_name:sn, route_long_name:nm, color } = f.properties;
      if (!byLine[sn]) byLine[sn] = { color: color||'#666', name: nm||'', features:[] };
      byLine[sn].features.push(f);
    });

    const listEl = document.getElementById('route-list');
    Object.entries(byLine)
      .sort(([a],[b]) => { const na=parseInt(a)||9999, nb=parseInt(b)||9999; return na!==nb ? na-nb : a.localeCompare(b); })
      .forEach(([sn, info]) => {
        const grp = L.layerGroup();
        info.features.forEach(f => {
          L.polyline(f.geometry.coordinates.map(c=>[c[1],c[0]]), { color:info.color, weight:2.5, opacity:.82 })
            .bindPopup('<b>'+sn+'</b><br>'+info.name).addTo(grp);
        });
        grp.addTo(map);
        routeGroups[sn] = grp;

        const row = document.createElement('div'); row.className = 'r-row';
        const lbl = document.createElement('label');
        const cb  = document.createElement('input'); cb.type='checkbox';
        const defaultOn = campus === 'viikki' ? VIIKKI_ROUTES.has(sn) : AALTO_ROUTES.has(sn);
        cb.checked = defaultOn;
        if (!defaultOn) map.removeLayer(grp);
        cb.onchange = () => cb.checked ? grp.addTo(map) : map.removeLayer(grp);
        routeCBs[sn] = cb;
        const bar = document.createElement('span'); bar.className='r-bar'; bar.style.background=info.color;
        const snEl = document.createElement('span'); snEl.className='r-sn'; snEl.textContent=sn;
        const nmEl = document.createElement('span'); nmEl.className='r-nm';
        nmEl.textContent = info.name.replace(/^[^-]+-\s*/,'').trim() || info.name;
        lbl.append(cb, bar, snEl, nmEl); row.appendChild(lbl); listEl.appendChild(row);
      });
  } finally { setLoading(false); }
}

function allRoutes(on) {
  Object.values(routeGroups).forEach(g => on ? g.addTo(map) : map.removeLayer(g));
  document.querySelectorAll('#route-list input').forEach(cb => cb.checked = on);
}

function applyRouteDefaults(c) {
  Object.entries(routeCBs).forEach(([sn, cb]) => {
    const on = c === 'viikki' ? VIIKKI_ROUTES.has(sn) : AALTO_ROUTES.has(sn);
    cb.checked = on;
    const grp = routeGroups[sn];
    if (!grp) return;
    on ? grp.addTo(map) : map.removeLayer(grp);
  });
}

function bringRoutesToTop() {
  Object.values(routeGroups).forEach(g => g.eachLayer(l => l.bringToFront && l.bringToFront()));
}
map.on('layeradd', () => setTimeout(bringRoutesToTop, 60));

/* ── Commute ── */
async function ensureCommute(c) {
  if (cache.commute[c]) return;
  setLoading(true);
  try {
    const files = CAMPUS_CFG[c].commuteFiles;
    const datasets = await Promise.all(files.map(f => fetchJson(f)));
    const merged = { type: 'FeatureCollection', features: [] };
    datasets.forEach(d => merged.features.push(...d.features));
    cache.commute[c] = merged;
  } finally { setLoading(false); }
}

const THR_STEPS  = [0, 10, 15, 20, 30, 40];
const THR_LABELS = ['关闭', '10 min', '15 min', '20 min', '30 min', '40 min'];

function renderCommute(data, minutes) {
  commuteGroup.clearLayers();
  if (!minutes || !data) return;
  data.features.forEach(f => {
    const p = f.properties || {};
    if (Number(p.minutes) !== minutes) return;
    if (f.geometry.type !== 'Polygon') return;
    if (p.kind !== 'convex_hull_outline') return;
    const lls = f.geometry.coordinates[0].map(c => [c[1],c[0]]);
    const color = COMMUTE_COLORS[minutes] || '#666';
    L.polygon(lls, { color, weight:2.5, fill:false, dashArray:'6 4', opacity:.9 })
      .bindPopup(T('commute_pp', minutes))
      .addTo(commuteGroup);
  });
  document.getElementById('commute-legend').classList.add('visible');
}

async function setThreshold(t) {
  threshold = t;
  commuteGroup.clearLayers();
  if (!t) { document.getElementById('commute-legend').classList.remove('visible'); return; }
  await ensureCommute(campus);
  renderCommute(cache.commute[campus], t);
  bringRoutesToTop();
}

function onSlider(val) {
  const t = THR_STEPS[Number(val)];
  document.getElementById('thr-label').textContent = THR_LABELS[Number(val)];
  setThreshold(t);
}

function updateThrButtons() {}  // no-op: slider has no inactive states

/* ── Campus ── */
async function setCampus(c) {
  campus = c;
  document.getElementById('btn-viikki').classList.toggle('on', c==='viikki');
  document.getElementById('btn-aalto').classList.toggle('on',  c==='aalto');
  updateCampusMarker(c);
  threshold = 0;
  commuteGroup.clearLayers();
  document.getElementById('thr-slider').value = 0;
  document.getElementById('thr-label').textContent = '关闭';
  document.getElementById('commute-legend').classList.remove('visible');

  // Housing visibility: HYS = UH Viikki only, AYY = Aalto only, HOAS = both
  const btnHys = document.getElementById('btn-hys');
  const btnAyy = document.getElementById('btn-ayy');
  if (c === 'aalto') {
    btnHys.style.display = 'none';
    btnAyy.style.display = '';
    if (layerOn.hys) { layerOn.hys = false; hysGroup.clearLayers(); btnHys.classList.remove('on-blue'); }
  } else {
    btnAyy.style.display = 'none';
    btnHys.style.display = '';
    if (layerOn.ayy) { layerOn.ayy = false; ayyGroup.clearLayers(); btnAyy.classList.remove('on'); }
  }

  applyRouteDefaults(c);
  const v = CAMPUS_CFG[c].view;
  if (v.bounds) map.fitBounds(v.bounds, { padding:[24,24] });
  else map.setView(v.ll, v.zoom);
  if (layerOn.hoas) { hoasGroup.clearLayers(); delete cache.hoas[c]; await loadHousing('hoas'); }
  if (layerOn.hys && c==='viikki') { hysGroup.clearLayers(); delete cache.hys[c]; await loadHousing('hys'); }
  if (layerOn.walk) rebuildWalkCircles(c);
}

/* ── Housing ── */
function hoasPopup(p) {
  const rent = [p.min_rent!=null?'€'+p.min_rent:null, p.max_rent!=null&&p.max_rent!==p.min_rent?'€'+p.max_rent:null].filter(Boolean).join('–');
  const bd = p.rent_breakdown ? '<br><span style="color:#555;font-size:11px;">'+p.rent_breakdown+'</span>' : '';
  const commute = p.aalto_otaniemi_min!=null ? '<br>'+T('to_aalto', p.aalto_otaniemi_min) : '';
  const cond = p.condition ? '<br>'+p.condition : '';
  let years = '';
  if (p.year_built) {
    const reno = p.year_renovated && p.year_renovated.length ? ' → ' + p.year_renovated.join(', ') : '';
    years = '<br><span style="color:#6b7280;font-size:11px;">🏗 ' + p.year_built + reno + '</span>';
  }
  return '<b>'+(p.address||'HOAS')+'</b>'+(rent?'<br>'+rent+T('per_month'):'')+bd+commute+cond+years+'<br><a href="'+p.url+'" target="_blank">'+T('view')+'</a>';
}
function hysPopup(p) {
  const rent = [p.min_rent!=null?'€'+p.min_rent:null, p.max_rent!=null&&p.max_rent!==p.min_rent?'€'+p.max_rent:null].filter(Boolean).join('–');
  const bd = p.rent_breakdown ? '<br><span style="color:#555;font-size:11px;">'+p.rent_breakdown+'</span>' : '';
  const commute = p.aalto_otaniemi_min!=null ? '<br>'+T('to_aalto', p.aalto_otaniemi_min) : '';
  return '<b>'+(p.address||p.name||'HYS')+'</b>'+(rent?'<br>'+rent+T('per_month'):'')+bd+commute+'<br><a href="'+p.url+'" target="_blank">'+T('view')+'</a>';
}

async function loadHousing(type) {
  const isHoas = type === 'hoas';
  const grp = isHoas ? hoasGroup : hysGroup;
  if (!cache[type][campus]) {
    setLoading(true);
    try { cache[type][campus] = await fetchJson(isHoas ? CAMPUS_CFG[campus].hoasFile : CAMPUS_CFG[campus].hysFile); }
    finally { setLoading(false); }
  }
  grp.clearLayers();
  cache[type][campus].features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    L.marker([lat,lon], { icon: isHoas ? ICON_HOAS : ICON_HYS })
      .bindPopup(isHoas ? hoasPopup(f.properties) : hysPopup(f.properties))
      .addTo(grp);
  });
}

/* ── AYY ── */
function ayyPopup(p) {
  const rent = p.rent ? `<br>${p.rent}${T('per_month')}` : '';
  const types = p.room_types ? `<br>${p.room_types}` : '';
  const yr = p.year_built ? ` (${p.year_built})` : '';
  const units = p.n_units ? `<br>${T('n_units', p.n_units)}` : '';
  return `<b>${p.address}</b>${yr}<br>${p.city}${rent}${types}${units}<br><a href="${p.url}" target="_blank">${T('bldg_detail')}</a>`;
}

async function loadAyy() {
  if (!cache.ayy) {
    setLoading(true);
    try { cache.ayy = await fetchJson('data/ayy_listings.geojson'); }
    finally { setLoading(false); }
  }
  ayyGroup.clearLayers();
  cache.ayy.features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    L.marker([lat, lon], { icon: ICON_AYY })
      .bindPopup(ayyPopup(f.properties)).addTo(ayyGroup);
  });
}

/* ── Toggle ── */
async function toggleLayer(type) {
  layerOn[type] = !layerOn[type];
  const on = layerOn[type];
  const cfg = { hoas:['btn-hoas','on-red'], hys:['btn-hys','on-blue'], ayy:['btn-ayy','on'], zones:['btn-zones','on'], walk:['btn-walk','on'] };
  const [id, cls] = cfg[type];
  document.getElementById(id).classList.toggle(cls, on);

  if (type === 'hoas') {
    if (on) await loadHousing('hoas'); else hoasGroup.clearLayers();
  } else if (type === 'hys') {
    if (on) await loadHousing('hys'); else hysGroup.clearLayers();
  } else if (type === 'ayy') {
    if (on) await loadAyy(); else ayyGroup.clearLayers();
  } else if (type === 'zones') {
    if (on) {
      if (!cache.zones) {
        setLoading(true);
        try { cache.zones = await fetchJson('data/hsl_zones.geojson'); } finally { setLoading(false); }
      }
      L.geoJSON(cache.zones, {
        style: f => ({ color: ZONE_COLORS[(f.properties.zone||'').toUpperCase()]||'#888', weight:2, fillOpacity:.04, dashArray:'5 4' }),
        onEachFeature: (f,l) => { if(f.properties.zone) l.bindPopup('HSL 票价区 '+f.properties.zone); }
      }).addTo(zonesGroup);
    } else { zonesGroup.clearLayers(); }
  } else if (type === 'walk') {
    if (on) { rebuildWalkCircles(campus); walkGroup.addTo(map); } else map.removeLayer(walkGroup);
  }
}

/* ── Global search ── */
let gsIndex = null;
let gsIndexPromise = null;
let gsTimer = null;

async function buildSearchIndex() {
  const [hoasV, hoasA, hysV, hysA, ayy] = await Promise.all([
    fetchJson('data/hoas_listings.geojson'),
    fetchJson('data/hoas_listings_aalto_otaniemi.geojson'),
    fetchJson('data/hys_listings.geojson'),
    fetchJson('data/hys_listings_aalto_otaniemi.geojson'),
    fetchJson('data/ayy_listings.geojson'),
  ]);

  const idx = { HOAS: [], HYS: [], AYY: [] };
  const seen = new Set();

  [...hoasV.features, ...hoasA.features].forEach(f => {
    const addr = f.properties.address || '';
    if (seen.has('hoas:' + addr)) return;
    seen.add('hoas:' + addr);
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties;
    const rent = p.min_rent != null
      ? '€' + p.min_rent + (p.max_rent && p.max_rent !== p.min_rent ? '–' + p.max_rent : '') + '/月'
      : '';
    idx.HOAS.push({ address: addr, city: p.city || 'Helsinki', meta: rent, coords: [lat, lon], url: p.url });
  });

  [...hysV.features, ...hysA.features].forEach(f => {
    const addr = f.properties.address || f.properties.name || '';
    if (seen.has('hys:' + addr)) return;
    seen.add('hys:' + addr);
    const [lon, lat] = f.geometry.coordinates;
    idx.HYS.push({ address: addr, city: 'Helsinki', meta: '', coords: [lat, lon], url: f.properties.url });
  });

  ayy.features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties;
    idx.AYY.push({ address: p.address, city: p.city || '', meta: p.rent ? p.rent + '/月' : '', coords: [lat, lon], url: p.url });
  });

  return idx;
}

async function ensureGsIndex() {
  if (gsIndex) return;
  if (!gsIndexPromise) gsIndexPromise = buildSearchIndex();
  gsIndex = await gsIndexPromise;
}

function onSearchInput(val) {
  clearTimeout(gsTimer);
  gsTimer = setTimeout(() => globalSearch(val), 150);
}

async function globalSearch(query) {
  const resultsEl = document.getElementById('gs-results');
  const q = query.trim().toLowerCase();
  if (!q) { resultsEl.classList.remove('visible'); return; }

  await ensureGsIndex();
  resultsEl.innerHTML = '';
  let total = 0;

  for (const [type, items] of Object.entries(gsIndex)) {
    const matches = items.filter(it =>
      it.address.toLowerCase().includes(q) || it.city.toLowerCase().includes(q)
    );
    if (!matches.length) continue;
    total += matches.length;

    const head = document.createElement('div');
    head.className = 'gs-group-head';
    head.textContent = type;
    resultsEl.appendChild(head);

    matches.slice(0, 6).forEach(it => {
      const el = document.createElement('div');
      el.className = 'gs-item';
      el.innerHTML = `<span class="gs-addr">${it.address}</span><span class="gs-meta">${it.city}${it.meta ? ' · ' + it.meta : ''}</span>`;
      el.onclick = () => {
        gsMarkGroup.clearLayers();
        const iconMap = { HOAS: ICON_HOAS, HYS: ICON_HYS, AYY: ICON_AYY };
        const m = L.marker(it.coords, { icon: iconMap[type] || ICON_HOAS })
          .bindPopup(`<b>${it.address}</b><br>${it.city}${it.meta ? '<br>' + it.meta : ''}<br><a href="${it.url}" target="_blank">${T('view_detail')}</a>`)
          .addTo(gsMarkGroup);
        map.flyTo(it.coords, 16, { duration: 0.8 });
        setTimeout(() => m.openPopup(), 850);
        document.getElementById('gs-input').value = it.address;
        resultsEl.classList.remove('visible');
      };
      resultsEl.appendChild(el);
    });
    if (matches.length > 6) {
      const more = document.createElement('div');
      more.className = 'gs-more';
      more.textContent = `还有 ${matches.length - 6} 处…`;
      resultsEl.appendChild(more);
    }
  }

  if (!total) {
    resultsEl.innerHTML = '<div class="gs-empty">无匹配结果</div>';
  }
  resultsEl.classList.add('visible');
}

document.addEventListener('click', e => {
  if (!document.getElementById('gs-wrap').contains(e.target))
    document.getElementById('gs-results').classList.remove('visible');
});

/* ── Supermarkets ── */
async function toggleSuper(key) {
  superOn[key] = !superOn[key];
  document.getElementById('sbtn-' + key).classList.toggle('on', superOn[key]);
  const grp = superGroups[key];
  if (!superOn[key]) { map.removeLayer(grp); return; }
  if (!superCache[key]) {
    setLoading(true);
    try { superCache[key] = await fetchJson(SUPER_CFG[key].file); }
    finally { setLoading(false); }
    const cfg = SUPER_CFG[key];
    const icon = cfg.logo ? superIcon(cfg.bg, cfg.logo) : superTextIcon(cfg.bg, cfg.text);
    superCache[key].features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties;
      const addr = p.address ? `<br>${p.address}` : '';
      const hours = p.opening_hours ? `<br><span style="color:#6b7280;font-size:11px;">${p.opening_hours}</span>` : '';
      L.marker([lat, lon], { icon })
        .bindPopup(`<b>${p.name}</b>${addr}${hours}`)
        .addTo(grp);
    });
  }
  grp.addTo(map);
}

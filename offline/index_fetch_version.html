<!doctype html>
<html lang='zh-CN'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Offline HSL routes - Pasteurinkatu 1D</title><link rel='stylesheet' href='assets/leaflet.css'/><script src='assets/leaflet.js'></script>
<style>html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.panel{position:absolute;top:12px;left:12px;z-index:1000;width:420px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;background:rgba(255,255,255,.96);border:1px solid #d0d7de;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px 16px}h1{font-size:18px;margin:0 0 8px}.small{font-size:12px;color:#57606a;line-height:1.4}.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:13px}.badge{display:inline-block;width:22px;height:5px;border-radius:5px;margin-right:6px;vertical-align:middle}.status{font-size:13px;padding:8px;border-radius:10px;background:#f6f8fa;margin:8px 0;white-space:pre-wrap}</style></head>
<body><div id='map'></div><div class='panel'><h1>离线版：Pasteurinkatu 1D 周边 HSL 真实线路轨迹</h1><div id='status' class='status'>正在读取本地素材…</div><div id='legend' class='legend'></div><p class='small'>所有线路来自本地 data/routes.geojson，由 HSL GTFS shapes.txt 预提取。底图来自本地 tiles/，可离线打开。</p><p class='small'>黑色虚线圈：400 m 严格约5分钟；橙色虚线圈：500 m 边界参考。</p></div>
<script>
const CENTER=[60.2245961,25.014318];const map=L.map('map',{preferCanvas:true}).setView(CENTER,15);L.tileLayer('tiles/{z}/{x}/{y}.png',{minZoom:10,maxZoom:16,tms:false,attribution:'Offline OSM tiles / HSL GTFS derived routes'}).addTo(map);const statusEl=document.getElementById('status'),legendEl=document.getElementById('legend');L.marker(CENTER).bindPopup('<b>Pasteurinkatu 1D</b><br>离线地图中心').addTo(map);L.circle(CENTER,{radius:400,color:'#111',weight:2,dashArray:'6 6',fillColor:'#ffeb3b',fillOpacity:.08}).addTo(map);L.circle(CENTER,{radius:500,color:'#ff9800',weight:2,dashArray:'4 8',fill:false}).addTo(map);const layers={};function addLegend(sn,color,longName){const lab=document.createElement('label');lab.innerHTML=`<input type="checkbox" checked> <span class="badge" style="background:${color}"></span>${sn} ${longName||''}`;legendEl.appendChild(lab);lab.querySelector('input').addEventListener('change',e=>{if(e.target.checked)layers[sn].addTo(map);else map.removeLayer(layers[sn]);});}
Promise.all([fetch('data/routes.geojson').then(r=>r.json()),fetch('data/stops.json').then(r=>r.json()),fetch('data/metadata.json').then(r=>r.json())]).then(([gj,st,meta])=>{const seen={};let bounds=L.latLngBounds([]);gj.features.forEach(f=>{const p=f.properties,sn=p.route_short_name,color=p.color||'#333';if(!layers[sn])layers[sn]=L.layerGroup().addTo(map);const latlngs=f.geometry.coordinates.map(c=>[c[1],c[0]]);const poly=L.polyline(latlngs,{color,weight:sn==='15'?5:3.2,opacity:.78}).bindPopup(`<b>${sn} ${p.route_long_name||''}</b><br>GTFS shape_id: ${p.shape_id}<br>points: ${p.point_count}`);poly.addTo(layers[sn]);bounds.extend(poly.getBounds());if(!seen[sn]){seen[sn]=true;addLegend(sn,color,p.route_long_name||'');}});st.stops.forEach(s=>{const c=s.distance_m<=400?'#2e7d32':'#ef6c00';L.circleMarker([s.lat,s.lon],{radius:8,color:c,fillColor:c,fillOpacity:.9}).bindPopup(`<b>${s.name}</b><br>${s.distance_m} m<br>${s.lines}`).addTo(map);});statusEl.textContent=`完成：${meta.feature_count} 条 GTFS shape，${meta.shape_point_count.toLocaleString()} 个轨迹点。`;if(bounds.isValid())map.fitBounds(bounds.pad(.05));}).catch(err=>{statusEl.textContent='读取离线素材失败：'+err.message;console.error(err);});
</script></body></html>
